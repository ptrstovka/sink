# Merge these fields into the existing Traefik v3 install configuration. The
# dynamic Sink example uses v3 HostRegexp/HostSNIRegexp rule syntax.
# Zero request/connection deadlines are intentional for unbounded uploads,
# downloads, SSE, and WebSockets; enforce resource controls elsewhere.
# The websecure entry point may also retain unrelated HTTP routers: Traefik
# evaluates a matching Sink TCP/SNI router first and falls through to HTTP
# routing for other domains.
# The dynamic Sink TCP service sends PROXY v2 to its upstream. Configure Sink
# to require it and trust only the exact Traefik peer CIDR; do not enable
# entry-point forwarded-header trust for arbitrary public sources.
entryPoints:
  web:
    address: ":80"
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 0s

  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 0s

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
