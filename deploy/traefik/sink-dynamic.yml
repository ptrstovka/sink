# Traefik v3 dynamic configuration. Replace every example.com occurrence.
# The regular expressions intentionally match every descendant depth. Sink's
# namespace policy remains the authorization boundary. The HTTPS service sends
# PROXY v2 so Sink can authenticate the Traefik peer before trusting the public
# source/destination metadata used by raw TLS routes.
http:
  routers:
    sink-http:
      entryPoints: [web]
      rule: 'Host(`example.com`) || HostRegexp(`^[a-z0-9-]+(\.[a-z0-9-]+)*\.example\.com$`)'
      priority: 100
      service: sink-http

  services:
    sink-http:
      loadBalancer:
        passHostHeader: true
        serversTransport: sink-streaming
        servers:
          - url: http://127.0.0.1:8080

  serversTransports:
    sink-streaming:
      maxIdleConnsPerHost: 256
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 0s
        idleConnTimeout: 90s

tcp:
  routers:
    sink-https:
      entryPoints: [websecure]
      rule: 'HostSNI(`example.com`) || HostSNIRegexp(`^[a-z0-9-]+(\.[a-z0-9-]+)*\.example\.com$`)'
      priority: 100
      service: sink-https
      tls:
        passthrough: true

  services:
    sink-https:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: 127.0.0.1:8443
