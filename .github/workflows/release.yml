name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to receive rebuilt assets
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: ${{ matrix.archive_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            archive_suffix: macos-arm64
            macos: true
            install_musl: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive_suffix: macos-x86_64
            macos: true
            install_musl: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive_suffix: linux-arm64
            macos: false
            install_musl: true
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive_suffix: linux-x86_64
            macos: false
            install_musl: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build and verify embedded dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run verify

      - name: Install target
        run: rustup target add "${{ matrix.target }}"

      - name: Install musl build tools
        if: matrix.install_musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: >-
          cargo build --release --locked --target "${{ matrix.target }}"
          --bin sink --bin sink-server

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          install -m 0755 "target/${{ matrix.target }}/release/sink" dist/package/sink
          install -m 0755 "target/${{ matrix.target }}/release/sink-server" dist/package/sink-server
          install -m 0644 LICENSE-MIT dist/package/LICENSE-MIT

      - name: Import Apple signing certificate
        if: matrix.macos
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_DEVELOPER_ID_P12:?Missing APPLE_DEVELOPER_ID_P12 secret}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?Missing APPLE_DEVELOPER_ID_P12_PASSWORD secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          g1_intermediate_path="$RUNNER_TEMP/developer-id-g1.cer"
          g2_intermediate_path="$RUNNER_TEMP/developer-id-g2.cer"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12" | /usr/bin/base64 -D > "$certificate_path"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            --output "$g1_intermediate_path"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$g2_intermediate_path"
          printf '%s  %s\n%s  %s\n' \
            '7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f' \
            "$g1_intermediate_path" \
            'f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a' \
            "$g2_intermediate_path" | shasum --algorithm 256 --check
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          for intermediate_path in "$g1_intermediate_path" "$g2_intermediate_path"; do
            if ! import_output="$(
              security import "$intermediate_path" \
                -A -t cert -f x509 -k "$keychain_path" 2>&1
            )"; then
              printf '%s\n' "$import_output"
              if [[ "$import_output" != *'already exists in the keychain'* ]]; then
                exit 1
              fi
            else
              printf '%s\n' "$import_output"
            fi
          done
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk -v team="$APPLE_TEAM_ID" \
                'index($0, "Developer ID Application:") && index($0, "(" team ")") { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "No Developer ID Application identity found for team $APPLE_TEAM_ID" >&2
            security find-identity -v -p codesigning "$keychain_path"
            exit 1
          fi

          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Sign macOS binaries
        if: matrix.macos
        shell: bash
        run: |
          set -euo pipefail
          for binary in dist/package/sink dist/package/sink-server; do
            codesign \
              --force \
              --keychain "$APPLE_KEYCHAIN_PATH" \
              --options runtime \
              --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" \
              "$binary"
            codesign --verify --strict --verbose=2 "$binary"

            binary_name="${binary##*/}"
            chain_prefix="$RUNNER_TEMP/${binary_name}-${{ matrix.archive_suffix }}-codesign"
            codesign --display \
              --extract-certificates="$chain_prefix" \
              "$binary"
            test -s "${chain_prefix}0"
            test -s "${chain_prefix}1"
            openssl x509 -inform DER -in "${chain_prefix}1" \
              -noout -subject | grep -F 'Developer ID Certification Authority'
          done

      - name: Notarize macOS binaries
        if: matrix.macos
        shell: bash
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER_ID:?Missing APPLE_API_ISSUER_ID secret}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID secret}"
          : "${APPLE_API_KEY_P8:?Missing APPLE_API_KEY_P8 secret}"

          api_key_path="$RUNNER_TEMP/notary-api-key.p8"
          submission_path="$RUNNER_TEMP/sink-${{ matrix.archive_suffix }}-notarization.zip"
          result_path="$RUNNER_TEMP/notarization-result.json"
          log_path="$RUNNER_TEMP/notarization-log.json"

          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 0600 "$api_key_path"
          /usr/bin/ditto -c -k --keepParent dist/package "$submission_path"

          submit_exit=0
          xcrun notarytool submit "$submission_path" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format json > "$result_path" || submit_exit=$?
          cat "$result_path"

          submission_id="$(
            /usr/bin/plutil -extract id raw -o - "$result_path" 2>/dev/null || true
          )"
          status="$(
            /usr/bin/plutil -extract status raw -o - "$result_path" 2>/dev/null || true
          )"
          if [[ -z "$submission_id" ]]; then
            echo "Notary service did not return a submission ID" >&2
            exit 1
          fi

          xcrun notarytool log "$submission_id" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            "$log_path"
          cat "$log_path"

          if (( submit_exit != 0 )) || [[ "$status" != "Accepted" ]]; then
            echo "Apple notarization failed with status: ${status:-unknown}" >&2
            exit 1
          fi

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="sink-${RELEASE_TAG}-${{ matrix.archive_suffix }}.tar.gz"
          tar -C dist/package -czf "dist/${archive}" \
            sink sink-server LICENSE-MIT

      - name: Verify unpacked release package
        shell: bash
        run: |
          set -euo pipefail
          archive="sink-${RELEASE_TAG}-${{ matrix.archive_suffix }}.tar.gz"
          verification_dir="$RUNNER_TEMP/release-verification-${{ matrix.archive_suffix }}"
          mkdir -p "$verification_dir"
          tar -C "$verification_dir" -xzf "dist/${archive}"
          release_version="${RELEASE_TAG#v}"
          sink_version="$("$verification_dir/sink" version)"
          server_version="$("$verification_dir/sink-server" version)"
          if [[ "$sink_version" != "sink $release_version" ]]; then
            echo "Packaged sink version does not match $RELEASE_TAG: $sink_version" >&2
            exit 1
          fi
          if [[ "$server_version" != "sink-server $release_version" ]]; then
            echo "Packaged sink-server version does not match $RELEASE_TAG: $server_version" >&2
            exit 1
          fi

      - name: Smoke packaged embedded dashboard
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail

          verification_dir="$RUNNER_TEMP/release-verification-${{ matrix.archive_suffix }}"
          smoke_root="$RUNNER_TEMP/embedded-dashboard-smoke"
          smoke_bin="$smoke_root/bin"
          empty_cwd="$smoke_root/empty-cwd"
          stdout_log="$smoke_root/sink.stdout"
          stderr_log="$smoke_root/sink.stderr"
          html_file="$smoke_root/index.html"
          api_file="$smoke_root/transactions.json"
          js_file="$smoke_root/application.js"
          mkdir -p "$smoke_bin" "$empty_cwd"
          install -m 0755 "$verification_dir/sink" "$smoke_bin/sink"

          if (PATH="$smoke_bin"; command -v node >/dev/null); then
            echo "Node unexpectedly available in the packaged smoke PATH" >&2
            exit 1
          fi

          dashboard_port="$(python3 - <<'PY'
          import socket

          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              print(listener.getsockname()[1])
          PY
          )"
          base_url="http://127.0.0.1:${dashboard_port}"
          sink_pid=""

          cleanup() {
            if [[ -n "$sink_pid" ]] && kill -0 "$sink_pid" 2>/dev/null; then
              kill -TERM "$sink_pid" 2>/dev/null || true
              for _ in {1..20}; do
                kill -0 "$sink_pid" 2>/dev/null || break
                sleep 0.25
              done
              kill -KILL "$sink_pid" 2>/dev/null || true
              wait "$sink_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          workspace="$PWD"
          cd "$empty_cwd"
          PATH="$smoke_bin" "$smoke_bin/sink" http 1 \
            --authtoken inspector-smoke-token \
            --server-addr http://127.0.0.1:1 \
            --allow-plaintext-control \
            --dashboard-port "$dashboard_port" \
            >"$stdout_log" 2>"$stderr_log" &
          sink_pid=$!
          cd "$workspace"

          ready=false
          for _ in {1..80}; do
            if curl --fail --silent --show-error "$base_url/" > "$html_file"; then
              ready=true
              break
            fi
            if ! kill -0 "$sink_pid" 2>/dev/null; then
              echo "Packaged sink exited before the dashboard became ready" >&2
              cat "$stdout_log" "$stderr_log" >&2
              exit 1
            fi
            sleep 0.25
          done
          if [[ "$ready" != true ]]; then
            echo "Packaged dashboard did not become ready" >&2
            cat "$stdout_log" "$stderr_log" >&2
            exit 1
          fi

          grep -F '<title>Sink traffic inspector</title>' "$html_file"
          js_path="$(sed -nE 's#.*src="(/assets/[^"]+\.js)".*#\1#p' "$html_file" | head -n 1)"
          if [[ ! "$js_path" =~ ^/assets/.+-[A-Za-z0-9_-]+\.js$ ]]; then
            echo "Dashboard HTML did not reference a hashed JavaScript asset" >&2
            exit 1
          fi
          curl --fail --silent --show-error "$base_url$js_path" > "$js_file"
          test -s "$js_file"
          curl --fail --silent --show-error \
            "$base_url/api/v1/transactions" > "$api_file"
          python3 - "$api_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert payload["transactions"] == []
          assert payload["capture"] == {"paused": False}
          PY

          kill -TERM "$sink_pid"
          for _ in {1..40}; do
            kill -0 "$sink_pid" 2>/dev/null || break
            sleep 0.25
          done
          if kill -0 "$sink_pid" 2>/dev/null; then
            echo "Packaged sink did not stop after SIGTERM" >&2
            exit 1
          fi
          set +e
          wait "$sink_pid"
          sink_status=$?
          set -e
          sink_pid=""
          if (( sink_status != 0 )); then
            echo "Packaged sink exited with status $sink_status" >&2
            cat "$stdout_log" "$stderr_log" >&2
            exit 1
          fi

          grep -Fx "inspector dashboard: $base_url" "$stdout_log"
          if grep -F 'inspector-smoke-token' "$stdout_log" "$stderr_log"; then
            echo "Control token appeared in packaged sink output" >&2
            exit 1
          fi
          python3 - "$dashboard_port" <<'PY'
          import socket
          import sys

          with socket.socket() as listener:
              listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              listener.bind(("127.0.0.1", int(sys.argv[1])))
          PY

      - name: Remove temporary Apple credentials
        if: always() && matrix.macos
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/apple-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/developer-id-g1.cer" \
            "$RUNNER_TEMP/developer-id-g2.cer" \
            "$RUNNER_TEMP/notary-api-key.p8"

      - name: Verify packaged macOS signatures independently
        if: matrix.macos
        shell: bash
        run: |
          set -euo pipefail
          verification_dir="$RUNNER_TEMP/release-verification-${{ matrix.archive_suffix }}"
          for binary in "$verification_dir/sink" "$verification_dir/sink-server"; do
            codesign --verify --strict --verbose=2 "$binary"

            binary_name="${binary##*/}"
            chain_prefix="$RUNNER_TEMP/packaged-${binary_name}-${{ matrix.archive_suffix }}-codesign"
            codesign --display \
              --extract-certificates="$chain_prefix" \
              "$binary"
            test -s "${chain_prefix}0"
            test -s "${chain_prefix}1"
          done

      - name: Store release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.archive_suffix }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksum manifest
        working-directory: dist
        run: sha256sum sink-*.tar.gz | sort -k2 > SHA256SUMS

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/SHA256SUMS
          --clobber --repo "${GITHUB_REPOSITORY}"
