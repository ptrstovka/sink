name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build and verify embedded dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run verify

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run fast tests
        run: cargo test --workspace --all-features --locked

# Normal CI intentionally excludes ignored/manual acceptance workloads, including
# 1 GiB transfers, the one-hour soak, and disruption or performance stress tests.
